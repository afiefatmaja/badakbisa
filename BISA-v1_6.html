<style>
:root{
 --bg:#0e1218;--pn:#161c24;--pn2:#1d242e;--ln:#2b3440;--ln2:#3a4553;
 --tx:#e8eef5;--mu:#8d99a8;--ac:#2f81f7;--ac2:#1f6feb;--inp:#0a0e13;
 --ok:#2ea043;--ok2:#3fb950;--wn:#d29922;--bd:#f85149;--vi:#bc8cff;--or:#f0883e;
 --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
 --sh:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25);
}
body[data-theme=light]{
 --bg:#eef1f5;--pn:#ffffff;--pn2:#f2f5f9;--ln:#d3dae3;--ln2:#b9c3d0;
 --tx:#10151c;--mu:#5a6675;--ac:#1257b8;--ac2:#1257b8;--inp:#ffffff;
 --ok:#0a6b21;--ok2:#0a7c27;--wn:#8a6100;--bd:#b3231b;--vi:#6f42c1;--or:#b35309;
 --sh:0 1px 2px rgba(16,21,28,.08),0 4px 14px rgba(16,21,28,.07);
}
*{box-sizing:border-box}html,body{margin:0;padding:0;overscroll-behavior:contain;overscroll-behavior-y:contain}
main{overscroll-behavior:contain}
body{background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3,h4{margin:0;font-weight:600}button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:50;background:var(--pn);border-bottom:1px solid var(--ln)}
.top{display:flex;align-items:center;gap:12px;padding:9px 14px;flex-wrap:wrap}
.top .lg{height:42px;width:42px;object-fit:contain;background:#fff;border-radius:8px;padding:2px}
.top h1{font-size:14.5px;letter-spacing:.2px}
.top p{margin:0;font-size:11px;color:var(--mu)}
.top .sp{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--ln2);border-radius:8px;overflow:hidden;background:var(--pn)}
.seg button{background:0;border:0;padding:7px 12px;cursor:pointer;color:var(--mu);font-size:12px;font-weight:600;white-space:nowrap}
.seg button.on{background:var(--ac2);color:#fff}
.seg button:hover:not(.on){background:var(--pn2);color:var(--tx)}
.steps{display:flex;padding:0 8px;overflow-x:auto;background:var(--pn);border-bottom:1px solid var(--ln)}
.steps button{flex:1;min-width:104px;background:0;border:0;border-bottom:2px solid transparent;padding:9px 6px 8px;cursor:pointer;color:var(--mu);text-align:center;white-space:nowrap}
.steps button .n{display:inline-flex;width:19px;height:19px;border-radius:50%;background:var(--pn2);color:var(--mu);align-items:center;justify-content:center;font-size:10.5px;font-weight:700;margin-right:5px;border:1px solid var(--ln2)}
.steps button .t{font-size:11.5px;font-weight:600}
.steps button.on{color:var(--tx);border-bottom-color:var(--ac)}
.steps button.on .n{background:var(--ac);color:#fff;border-color:var(--ac)}
.steps button.ok .n{background:rgba(46,160,67,.2);color:var(--ok2);border-color:var(--ok)}
main{max-width:1560px;margin:0 auto;padding:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}
.split{display:grid;grid-template-columns:minmax(360px,1fr) minmax(420px,1.2fr);gap:14px;align-items:start}
@media(max-width:1080px){.split{grid-template-columns:1fr}.g3,.g4{grid-template-columns:1fr 1fr}}
@media(max-width:720px){.g2,.g3,.g4{grid-template-columns:1fr}}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:12px;overflow:hidden;box-shadow:var(--sh);margin-bottom:14px}
.card>h3{padding:11px 15px;font-size:11.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--mu);
 border-bottom:1px solid var(--ln);background:var(--pn2);display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.card>h3 .tag{margin-left:auto;font-size:10px;text-transform:none;letter-spacing:0;color:var(--mu);font-weight:500}
.cb{padding:15px}
.f{display:flex;flex-direction:column;gap:5px}
.f label{font-size:11.5px;color:var(--mu);display:flex;gap:5px;align-items:baseline}
.f label b{color:var(--tx);font-weight:600}
.f .u{margin-left:auto;font-size:10px;color:var(--ln2);font-family:var(--mono)}
.f input,.f select,.f textarea{background:var(--inp);border:1px solid var(--ln2);border-radius:8px;padding:9px 10px;width:100%;font-family:var(--mono);font-size:13px}
.f textarea{font-family:inherit;resize:vertical;min-height:64px}
.f input:focus,.f select:focus,.f textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px rgba(47,129,247,.16)}
.hint{font-size:11px;color:var(--mu);margin:9px 0 0;line-height:1.55}
.hint code{font-family:var(--mono);color:var(--ac);font-size:10.5px}
.prov{font-size:10.5px;color:var(--mu);line-height:1.55;margin:10px 0 0;padding:9px 11px;border-left:2px solid var(--ln2);background:var(--pn2);border-radius:0 7px 7px 0}
.box{border-radius:9px;padding:10px 12px;font-size:12px;margin-bottom:11px;line-height:1.55}
.box.w{border:1px solid var(--wn);background:rgba(210,153,34,.09)}
.box.e{border:1px solid var(--bd);background:rgba(248,81,73,.09)}
.box.g{border:1px solid var(--ok);background:rgba(46,160,67,.09)}
.box.i{border:1px solid var(--ac2);background:rgba(47,129,247,.10)}
.btn{background:var(--pn2);border:1px solid var(--ln2);border-radius:9px;padding:9px 15px;cursor:pointer;font-size:12.5px;font-weight:600}
.btn:hover{border-color:var(--ac);color:var(--ac)}
.btn.p{background:var(--ac2);border-color:var(--ac2);color:#fff}
.btn.p:hover{background:#3b8ef8;color:#fff}
.btn.sm{padding:6px 11px;font-size:11px;font-weight:600}
.btn.dg:hover{border-color:var(--bd);color:var(--bd)}
.btn.ok{border-color:var(--ok);color:var(--ok2)}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.nav{display:flex;gap:10px;justify-content:space-between;margin:4px 0 26px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:9px}
.pick button{background:var(--inp);border:1.5px solid var(--ln2);border-radius:10px;padding:8px 6px 7px;cursor:pointer;text-align:center}
.pick button svg{width:100%;height:56px;display:block}
.pick button span{display:block;font-size:11px;color:var(--mu);margin-top:5px;font-weight:600}
.pick button:hover{border-color:var(--ac)}
.pick button.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,var(--pn));box-shadow:0 0 0 1px var(--ac)}
.pick button.on span{color:var(--ac)}
.cpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.cpick button{background:var(--inp);border:1.5px solid var(--ln2);border-radius:11px;padding:10px;cursor:pointer;text-align:left}
.cpick button svg{width:100%;height:74px;display:block}
.cpick button b{display:block;font-size:12px;margin-top:7px}
.cpick button span{display:block;font-size:10.5px;color:var(--mu);line-height:1.45;margin-top:2px}
.cpick button:hover{border-color:var(--ac)}

/* ---- v1.5 photographic figures on the pickers ------------------------ */
/* The plates are opaque white, so they carry their own light background in
   either theme and read like a spec sheet photograph. The schematic that used
   to sit in the tile has not been deleted: it moved to .cpldet below the
   picker, where the flex plane annotation that drives the tolerance basis is
   legible at a useful size instead of being squeezed into a 74px tile. */
.pick button .fig,.cpick button .fig{background:#fff;border:1px solid var(--ln2);border-radius:8px;
 overflow:hidden;line-height:0}
.pick button .fig img,.cpick button .fig img{width:100%;height:auto;display:block}
.pick button.on .fig,.cpick button.on .fig{border-color:var(--ac)}
.cpldet{display:grid;grid-template-columns:minmax(160px,240px) 1fr;gap:15px;align-items:center;
 margin-top:13px;padding:12px 13px;border:1px solid var(--ln2);border-radius:10px;background:var(--pn2)}
.cpldet svg{width:100%;height:84px;display:block}
.cpldet .txt{font-size:11.5px;color:var(--mu);line-height:1.55}
.cpldet .txt b{color:var(--tx);font-size:12px;display:block;margin-bottom:3px}
.cpldet .txt .fp{color:var(--ac);font-weight:600}

 color:var(--tx);border-radius:10px;padding:11px 18px;font-size:12.5px;z-index:120;box-shadow:var(--sh);transition:bottom .25s;max-width:92vw}

/* =========================================================================
   BISA — Badak LNG Integrated Shaft Alignment
   =========================================================================
   GEOMETRY OF THE MEASUREMENT, derived once and used everywhere.

   A dial reads positive when the plunger is pushed IN. With the bracket
   turning about shaft A and the tip on hub B, the reading at angular
   position u, zeroed at 0 deg (top), is  r(u) = e.u - e.y  where e is the
   position of hub B's centre relative to axis A. That gives

       (180 - 0)/2   =  -e_y        vertical  plane offset
       ( 90 - 270)/2 =  +e_x        horizontal plane offset

   The two are NOT the same sign, which is exactly why the classic graphical
   rule plots a stationary-hub reading one way and a movable-hub reading the
   other way (ROTA.08 sec. 2.2.3).

   Taking the STATIONARY shaft centreline as datum, x = 0 at the stationary
   indicator plane, x = D1 at the movable indicator plane, +y up and +x to
   the right as seen from the chosen viewpoint, the movable centreline is

   REVERSE INDICATOR
       yv(x) =  osV + ( -omV - osV )/D1 * x
       yh(x) = -osH + (  omH + osH )/D1 * x
     osV,osH = plane offsets of the reading set taken ON the stationary hub
     omV,omH = plane offsets of the reading set taken ON the movable hub

   FACE AND RIM   (bracket on the movable machine, rim dial on the stationary
                   hub rim, face dial on the stationary hub face, H = face
                   dial swing diameter)
       ROTA.08 sec. 3.2.2 fixes the plotting convention: a NEGATIVE face
       reading is plotted UP and a POSITIVE face reading is plotted DOWN for
       the vertical set, and the other way round for the horizontal set. The
       face therefore enters the slope with a minus sign, and the numeric
       formula in ROTA.08 Table 3.1, F = D*(VFA-VFD)/H - (VA-VD), follows
       from it. This is the opposite of what a naive plunger-direction
       argument gives, which is why it is pinned to the module's own worked
       example in test REF-3 rather than to a derivation.
       yv(x) =  osV + (-2*ofV/H) * x
       yh(x) = -osH + ( 2*ofH/H) * x

   Deviation  d(x) = y_actual(x) - y_desired(x).
   Correction MOVE UP    at a foot = -dv(foot)
   Correction MOVE LEFT  at a foot = +dh(foot)

   For the reverse case this reduces to the legacy workbook formula
       F = V2 * D / D1 - V1 ,  with V1 = as-ds at the stationary plane and
       V2 = (am-dm) + V1 at the movable plane,
   which is the form printed in ROTA.08 Table 2.1 and used by the Excel
   sheet the section has been running. Verified in the test suite.
   ========================================================================= */
var SA=(function(){
 "use strict";
 var MIL_MM=0.0254, IN_MM=25.4;
 function l2mm(v,u){return u==='met'?v:v*IN_MM;}
 function mm2l(v,u){return u==='met'?v:v/IN_MM;}
 function mm2d(v,u){return u==='met'?v:v/IN_MM;}      /* readings are keyed in inch */
 function d2mm(v,u){return u==='met'?v:v*IN_MM;}
 function planeOffset(d){ return { v:(d.B-d.T)/2, h:(d.R-d.L)/2 }; }
 function diamondValid(d){ var a=d.T+d.B, b=d.L+d.R; return {sumTB:a,sumLR:b,diff:a-b}; }

 /* movable centreline for one reading set, datum = stationary shaft */
 function centreline(pass,method,D1){
  var os=planeOffset(pass.stat), om=planeOffset(pass.mov), S=D1||1;
  if(method==='fr') return { v:{a:os.v, b:(-2*om.v)/S}, h:{a:-os.h, b:( 2*om.h)/S} };
  return { v:{a:os.v, b:(-om.v-os.v)/S}, h:{a:-os.h, b:( om.h+os.h)/S} };
 }
 function at(l,x){ return l.a+l.b*x; }
 function deviation(act,des,method,D1){
  var A=centreline(act,method,D1), D=centreline(des,method,D1);
  return { v:{a:A.v.a-D.v.a, b:A.v.b-D.v.b}, h:{a:A.h.a-D.h.a, b:A.h.b-D.h.b} };
 }

 var ANSI_GRADES=[{id:'AL4.5',g:4.5,n:'Minimal'},{id:'AL2.2',g:2.2,n:'Acceptable'},{id:'AL1.2',g:1.2,n:'Excellent'}];
 var ANSI_K=1080;
 function ansiAngle(g,rpm){ return (ANSI_K*g/rpm)/1000; }
 var ANSI_OA=[{r:900,ex:{o:4,a:1.0},ac:{o:8,a:1.5}},{r:1200,ex:{o:3,a:0.7},ac:{o:6,a:1.0}},
              {r:1800,ex:{o:2,a:0.5},ac:{o:4,a:0.7}},{r:3600,ex:{o:1,a:0.3},ac:{o:2,a:0.5}}];
 function oaRow(rpm){ for(var i=0;i<ANSI_OA.length;i++) if(rpm<=ANSI_OA[i].r) return ANSI_OA[i]; return ANSI_OA[3]; }

 function grade(val,acc){
  var a=Math.abs(val), r=acc>0?a/acc:0;
  if(!(acc>0)) return {cls:'n',ratio:0,txt:'-'};
  if(r>1)   return {cls:'r',ratio:r,txt:'OUT OF TOLERANCE'};
  if(r>0.8) return {cls:'y',ratio:r,txt:'MARGINAL'};
  return      {cls:'g',ratio:r,txt:'ACCEPTABLE'};
 }
 function softFoot(r,limit){
  var lim=limit>0?limit:2*MIL_MM, soft=[], mx=0, mi=-1;
  for(var i=0;i<4;i++){ var v=Math.abs(r[i]||0); if(v>lim) soft.push(i); if(v>mx){mx=v;mi=i;} }
  var o={limit:lim,readings:r,soft:soft,max:mx,maxFoot:mi,pass:soft.length===0,typeId:'ok',shim:[0,0,0,0]};
  if(!soft.length) return o;
  var diag=[[0,3],[1,2]];
  function isDiag(s){ if(s.length!==2) return false;
   for(var d=0;d<2;d++){ if((s[0]===diag[d][0]&&s[1]===diag[d][1])||(s[0]===diag[d][1]&&s[1]===diag[d][0])) return true; } return false; }
  function sameEnd(s){ var g=[[0,1],[2,3],[0,2],[1,3]];
   for(var k=0;k<4;k++) if(s.indexOf(g[k][0])>=0&&s.indexOf(g[k][1])>=0) return true; return false; }
  if(soft.length>=3||(soft.length===2&&sameEnd(soft)&&!isDiag(soft))){ o.typeId='induced'; return o; }
  if(soft.length===2&&isDiag(soft)){
   var a=Math.abs(r[soft[0]]), b=Math.abs(r[soft[1]]), big=Math.max(a,b), sm=Math.min(a,b);
   if(big>0&&(big-sm)/big<=0.10){ o.typeId='evenRock'; var h=((a+b)/2)*0.5; o.shim[soft[0]]=h; o.shim[soft[1]]=h; }
   else { o.typeId='shortFoot'; var bi=a>=b?soft[0]:soft[1]; o.shim[bi]=Math.abs(r[bi]); }
   return o;
  }
  o.typeId='shortFoot'; o.shim[mi]=mx; return o;
 }
 return {MIL_MM:MIL_MM,IN_MM:IN_MM,l2mm:l2mm,mm2l:mm2l,mm2d:mm2d,d2mm:d2mm,
  planeOffset:planeOffset,diamondValid:diamondValid,centreline:centreline,at:at,deviation:deviation,
  ANSI_GRADES:ANSI_GRADES,ANSI_K:ANSI_K,ansiAngle:ansiAngle,oaRow:oaRow,grade:grade,softFoot:softFoot};
})();

/* ===== STATE ============================================================ */
var UNIT='imp', LANG='id', THEME='dark', STEP=0, ACTIVE=1, RES=null;
var MM=SA.MIL_MM, IN=SA.IN_MM;
function d2mm(v){return UNIT==='imp'? v*IN : v;}
function mm2d(v){return UNIT==='imp'? v/IN : v;}
function l2mm(v){return SA.l2mm(v,UNIT);} function mm2l(v){return SA.mm2l(v,UNIT);}
function uD(){return UNIT==='imp'?'inch':'mm';}
/* ===== v1.5 DIAL INPUT UNIT =============================================
   Only the twelve dial reading boxes on the cross are keyed in MILS, and
   only in imperial mode. Every other field, the cross hub readout, the
   summary lines, the corrections, the report and the Excel export stay in
   inch exactly as before. A technician on the platform types 4.5 instead of
   0.0045: three fewer keystrokes per reading, twelve readings per pass, and
   no chance of dropping a zero on a wet tablet in the dark.
   Resolution is preserved: one decimal of a mil is 0.0001 inch, which is
   the same resolution the inch boxes had at dD()=4.
   In metric mode there is nothing to gain, so mm is kept and these reduce
   to the plain mm2d / d2mm pair.                                          */
function dialU(){return UNIT==='imp'?'mils':'mm';}
function mm2dial(v){return UNIT==='imp'? v/SA.MIL_MM : v;}
function dial2mm(v){return UNIT==='imp'? v*SA.MIL_MM : v;}
function dDial(){return UNIT==='imp'?1:3;}
function uL(){return UNIT==='imp'?'inch':'mm';}
function uA(){return UNIT==='imp'?'in/in':'mm/mm';}
function dD(){return UNIT==='imp'?4:3;} function dL(){return UNIT==='imp'?2:1;}
function fD(mm){return (isFinite(mm)?mm2d(mm):0).toFixed(dD());}
function fDs(mm){var v=isFinite(mm)?mm2d(mm):0; return (v>0?'+':'')+v.toFixed(dD());}
function fL(mm){return (isFinite(mm)?mm2l(mm):0).toFixed(dL());}
function fA(s){return (isFinite(s)?s:0).toFixed(5);}
function fMil(mm){return (isFinite(mm)? mm/SA.MIL_MM:0).toFixed(1);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function $(id){return document.getElementById(id);}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

/* ---- bar sag -----------------------------------------------------------
   ROTA.07 chapter V: the sag of the bracket is always an ADDITIVE correction,
   the full value at 180 deg and half of it at 90 and 270 deg, nothing at 0.
   Two consequences fall out of that and are used everywhere below:
     the vertical plane offset moves by exactly +sag/2
     the horizontal plane offset does not move at all, because the same half
       value is added to 90 and to 270 and cancels in (90 - 270)/2
   DESIRED is a design target, not a measurement, so it is never corrected.
   A face dial reads axially and is not affected by a radial droop, so in the
   face and rim method only the rim set is corrected.                        */
function sagFor(which,idx){

 if(isFR() && which==='mov') return 0;
 return S.sag||0;
}

}

  devV:dev.v, devH:dev.h,

  offV2:SA.at(dev.v,span), offH2:SA.at(dev.h,span),
  angV:dev.v.b, angH:dev.h.b,
  move:{ ibV:-SA.at(dev.v,D2), obV:-SA.at(dev.v,D3),
         ibH: SA.at(dev.h,D2), obH: SA.at(dev.h,D3) },   /* +V = up, +H = push left */
  lim:lim, span:span
 };
 var par=[];
 function P(key,lbl,ax,val,acc,kind,en){ par.push({key:key,lbl:lbl,en:en||lbl,ax:ax,value:val,acc:acc,kind:kind,grade:SA.grade(val,acc)}); }
 var L1=isFR()?(LANG==='id'?'Offset di bidang RIM':'Offset at the RIM plane')
              :(LANG==='id'?'Offset di flex plane 1 (stationary)':'Offset at flex plane 1 (stationary)');
 var L2=LANG==='id'?'Offset di flex plane 2 (movable)':'Offset at flex plane 2 (movable)';
 var LA='Angularity';
 var E1=isFR()?'Offset at the RIM plane':'Offset at flex plane 1 (stationary)';
 var E2='Offset at flex plane 2 (movable)';
 P('o1v',L1,'v',o.offV1,lim.offAcc,'disp',E1); P('o1h',L1,'h',o.offH1,lim.offAcc,'disp',E1);
 if(!isFR()){ P('o2v',L2,'v',o.offV2,lim.offAcc,'disp',E2); P('o2h',L2,'h',o.offH2,lim.offAcc,'disp',E2); }
 P('anv',LA,'v',o.angV,lim.angAcc,'ang','Angularity'); P('anh',LA,'h',o.angH,lim.angAcc,'ang','Angularity');
 o.params=par;
 o.worst=par.map(function(p){return p.grade.cls;})
   .reduce(function(a,b){return (a==='r'||b==='r')?'r':((a==='y'||b==='y')?'y':((a==='n'&&b==='n')?'n':'g'));},'g');

 function v(x,y,val,anch,deg){
  return '<text x="'+x+'" y="'+y+'" fill="'+tc+'" font-size="'+(11*big)+'" font-weight="700" font-family="ui-monospace,monospace" text-anchor="'+anch+'">'+fD(val)+'</text>'+
         '<text x="'+x+'" y="'+(y+9*big)+'" fill="'+ln+'" font-size="'+(7*big)+'" font-family="ui-monospace,monospace" text-anchor="'+anch+'">'+deg+'</text>';
 }
 s+=v(cx,cy-arm-14,d.T,'middle','0°');
 s+=v(cx+arm+8,cy-2,d.R,'start','90°');

 return s+'</svg>';
}

/* ===== v1.5 P&ID EQUIPMENT SYMBOLS ======================================
   The picker in section 2 used to reuse eqBody(), the side elevation drawn
   for the simulation. Those elevations exist to show feet, shims and the
   ground line, so as thumbnails they read as vague grey boxes that do not
   look like the real machine and carry no information the label does not
   already give.
   A P&ID symbol is the opposite: it is not a picture of the machine, it is
   the agreed engineering sign for its function, so it is recognised at a
   glance by anyone who reads a drawing. Drivers follow the ISA-5.1 / ISO
   10628 convention of a circle carrying the driver letter (M, T, E, G);
   driven machines use their process symbols, and gear and clutch boxes the
   rectangle with the interlocking element.
   eqBody() is unchanged and still draws the simulation elevations, where a
   realistic profile with feet on a ground line is the right thing.        */
/* v1.6: the P&ID symbol for the machine that is actually selected, shown
   below the picker so the engineering sign a technician sees on the plant
   drawing stays one glance away from the photograph they just picked. */
function eqDetail(k){
 if(k==='custom') return '';
 var id=(LANG==='id');
 return '<div class="cpldet"><div class="sch">'+pidIcon(k)+'</div><div class="txt">'+
  '<b>'+esc(eqName(k))+'</b>'+
  (id?'Simbol P&amp;ID untuk mesin ini, mengikuti konvensi ISA-5.1 / ISO 10628 yang dipakai pada gambar proses.'
     :'The P&amp;ID symbol for this machine, following the ISA-5.1 / ISO 10628 convention used on the process drawings.')+
  '</div></div>';
}
function pidIcon(k){
 var C=LT()?PL:PD, W=118, H=64, cx=59, cy=30, R=19;
 var ln=C.mv, tx0=C.tx, mu=C.mu;
 var s='<svg viewBox="0 0 '+W+' '+H+'">';
 function shaft(){ return '<line x1="6" y1="'+cy+'" x2="'+(cx-R-1)+'" y2="'+cy+'" stroke="'+mu+'" stroke-width="1.6"/>'+
   '<line x1="'+(cx+R+1)+'" y1="'+cy+'" x2="'+(W-6)+'" y2="'+cy+'" stroke="'+mu+'" stroke-width="1.6"/>'; }
 function circ(){ return '<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" stroke="'+ln+'" stroke-width="1.8"/>'; }
 function letter(t){ return '<text x="'+cx+'" y="'+(cy+6)+'" fill="'+tx0+'" font-size="17" font-weight="700"'+
   ' font-family="ui-monospace,monospace" text-anchor="middle">'+t+'</text>'; }
 function base(){ return '<line x1="4" y1="'+(H-8)+'" x2="'+(W-4)+'" y2="'+(H-8)+'" stroke="'+C.ln+'" stroke-width="1.3"/>'; }
 if(k==='custom')
  return s+'<rect x="16" y="12" width="86" height="36" rx="5" fill="none" stroke="'+ln+'" stroke-width="1.4" stroke-dasharray="6 4"/>'+
   '<text x="'+cx+'" y="35" fill="'+ln+'" font-size="17" font-family="ui-monospace,monospace" text-anchor="middle">+</text>'+base()+'</svg>';
 /* --- drivers: circle carrying the driver letter --- */
 if(k==='motor')     s+=shaft()+circ()+letter('M');
 else if(k==='turbine'){
  /* turbine: the driver circle plus the converging steam path stub */
  s+=shaft()+circ()+letter('T');
  s+='<path d="M'+(cx-R-13)+' '+(cy-11)+' L'+(cx-R-1)+' '+(cy-4)+' L'+(cx-R-1)+' '+(cy+4)+' L'+(cx-R-13)+' '+(cy+11)+' Z" fill="none" stroke="'+ln+'" stroke-width="1.4"/>';
 }
 else if(k==='engine')    s+=shaft()+circ()+letter('E');
 else if(k==='generator') s+=shaft()+circ()+letter('G');
 /* --- driven: process symbols --- */
 else if(k==='pump'){
  /* centrifugal pump: circle, suction on the axis, trapezoidal discharge up */
  s+='<line x1="6" y1="'+cy+'" x2="'+(cx-R-1)+'" y2="'+cy+'" stroke="'+mu+'" stroke-width="1.6"/>'+circ();
  s+='<path d="M'+(cx-7)+' '+(cy-R+3)+' L'+(cx-12)+' '+(cy-R-10)+' L'+(cx+12)+' '+(cy-R-10)+' L'+(cx+7)+' '+(cy-R+3)+'" fill="none" stroke="'+ln+'" stroke-width="1.6"/>';
  s+='<line x1="'+(cx+R+1)+'" y1="'+cy+'" x2="'+(W-6)+'" y2="'+cy+'" stroke="'+mu+'" stroke-width="1.6"/>';
 }
 else if(k==='compressor'){
  /* centrifugal compressor: trapezium narrowing toward the discharge */
  s+=shaft();
  s+='<path d="M'+(cx-24)+' '+(cy-17)+' L'+(cx+24)+' '+(cy-9)+' L'+(cx+24)+' '+(cy+9)+' L'+(cx-24)+' '+(cy+17)+' Z" fill="none" stroke="'+ln+'" stroke-width="1.8"/>';
  s+='<text x="'+(cx-3)+'" y="'+(cy+5)+'" fill="'+mu+'" font-size="10" font-family="ui-monospace,monospace" text-anchor="middle">C</text>';
 }
 else if(k==='blower'){
  /* blower: the scroll casing with a tangential discharge, which is what
     separates it on a drawing from the pump circle above */
  s+='<line x1="6" y1="'+cy+'" x2="'+(cx-R-1)+'" y2="'+cy+'" stroke="'+mu+'" stroke-width="1.6"/>'+circ();
  s+='<path d="M'+(cx-13)+' '+(cy+4)+' A13 13 0 1 1 '+(cx+9)+' '+(cy-10)+'" fill="none" stroke="'+ln+'" stroke-width="1.4"/>';
  s+='<path d="M'+(cx+9)+' '+(cy-10)+' L'+(cx+21)+' '+(cy-24)+' M'+(cx+17)+' '+(cy-2)+' L'+(cx+29)+' '+(cy-16)+'" stroke="'+ln+'" stroke-width="1.5" fill="none"/>';
  s+='<line x1="'+(cx+R+1)+'" y1="'+cy+'" x2="'+(W-6)+'" y2="'+cy+'" stroke="'+mu+'" stroke-width="1.6"/>';
 }
 else if(k==='fan'){
  /* axial fan: the propeller pair seen edge on inside the ring */
  s+=shaft()+circ();
  s+='<path d="M'+(cx-1)+' '+(cy-2)+' L'+(cx-16)+' '+(cy-11)+' L'+(cx-16)+' '+(cy-2)+' Z" fill="'+ln+'" stroke="'+ln+'" stroke-width="1.2"/>';
  s+='<path d="M'+(cx+1)+' '+(cy+2)+' L'+(cx+16)+' '+(cy+11)+' L'+(cx+16)+' '+(cy+2)+' Z" fill="'+ln+'" stroke="'+ln+'" stroke-width="1.2"/>';
  s+='<line x1="'+(cx-16)+'" y1="'+cy+'" x2="'+(cx+16)+'" y2="'+cy+'" stroke="'+ln+'" stroke-width="1.4"/>';
 }
 else if(k==='gearbox'){
  /* gear drive: box with the two meshing wheels */
  s+=shaft();
  s+='<rect x="'+(cx-25)+'" y="'+(cy-18)+'" width="50" height="36" rx="2" fill="none" stroke="'+ln+'" stroke-width="1.8"/>';
  s+='<circle cx="'+(cx-9)+'" cy="'+(cy-4)+'" r="9" fill="none" stroke="'+ln+'" stroke-width="1.3"/>';
  s+='<circle cx="'+(cx+8)+'" cy="'+(cy+5)+'" r="9" fill="none" stroke="'+ln+'" stroke-width="1.3"/>';
 }
 else if(k==='clutchbox'){
  /* clutch: box with the two engaging halves and the parting line */
  s+=shaft();
  s+='<rect x="'+(cx-25)+'" y="'+(cy-18)+'" width="50" height="36" rx="2" fill="none" stroke="'+ln+'" stroke-width="1.8"/>';
  s+='<path d="M'+(cx-14)+' '+(cy-11)+' L'+(cx-3)+' '+(cy-11)+' L'+(cx-3)+' '+(cy+11)+' L'+(cx-14)+' '+(cy+11)+'" fill="none" stroke="'+ln+'" stroke-width="1.4"/>';
  s+='<path d="M'+(cx+14)+' '+(cy-11)+' L'+(cx+3)+' '+(cy-11)+' L'+(cx+3)+' '+(cy+11)+' L'+(cx+14)+' '+(cy+11)+'" fill="none" stroke="'+ln+'" stroke-width="1.4"/>';
 }
 else s+=shaft()+circ()+letter('?');
 return s+base()+'</svg>';
}

function dimFig(light){
 pal(light);
 var W=1000,H=390,cy=142,base=258, ml=176,mr=84, pw=W-ml-mr;
 var D1=S.dim.D1||1, D2=S.dim.D2||1, D3=S.dim.D3||1, HH=27;
 var axSpan=Math.max(D3*1.22, (isFR()?1:D1*2.2));
 var X=function(x){return ml+(x/axSpan)*pw;};

/* ===== SIMULATION ======================================================
   One scale engine for every simulation frame so nothing is drawn with an
   invented exaggeration. The tolerance envelope is drawn as a band around
   the desired centreline, so a line inside the band is inside tolerance no
   matter how large the transverse magnification is, and the magnification
   factor itself is printed on the frame.                                  */
function simScale(idx,axis,pw,halfH){
 var Dref=refDim(), span=Math.max(S.dim.D3*1.16, (isFR()?S.dim.gap:S.dim.D1)*1.6, 1);
 var des=SA.centreline(effPass(0),S.method,Dref);
 var act=SA.centreline(effPass(Math.min(idx,S.passes.length-1)),S.method,Dref);
 var lim=tolLimits(), band=lim.offAcc||0;
 var mx=band*1.35;
 [0,S.dim.D1,S.dim.D2,S.dim.D3,span].forEach(function(x){
  mx=Math.max(mx, Math.abs(SA.at(des[axis],x)), Math.abs(SA.at(act[axis],x)),
                  Math.abs(SA.at(des[axis],x))+band);
 });
 mx=mx*1.18 || 1e-4;
 var ts=halfH/mx;                                   /* px per mm transverse */
 var as=pw/span;                                    /* px per mm axial */
 return {span:span,des:des,act:act,band:band,ts:ts,as:as,exag:ts/as,mx:mx};
}
function scaleNote(sc){
 return (LANG==='id'?'Skala aksial 1 : 1 sepanjang ':'Axial scale 1 : 1 over ')+fL(sc.span)+' '+uL()+
  (LANG==='id'?'  ·  skala melintang diperbesar × ':'  ·  transverse scale magnified × ')+
  (sc.exag>=100?Math.round(sc.exag):sc.exag.toFixed(sc.exag<10?1:0));
}

function boxLabel(x,y,t,col,bg,size){
 var w=(String(t).length*(size||10)*0.62)+12;
 return '<rect x="'+(x-w/2)+'" y="'+(y-(size||10)-2)+'" width="'+w+'" height="'+((size||10)+7)+'" rx="3" fill="'+bg+'" opacity=".92"/>'+
  tx(x,y,t,{a:'middle',s:size||10,f:col,w:700});
}
/* v1.5: decides how the two foot correction labels fit under the simulation.
   The labels are monospace, so 0.62em per character is a safe width estimate.
   Shrink from 10.5px down to an 8px floor first, because one readable row is
   better than two rows; only if the pair still will not fit does drop become
   non zero and the two rows are pushed apart. Kept out of simEq() so the rule
   can be tested without parsing an SVG. */
function footFit(a,b,xa,xb){
 var gap=Math.abs(xb-xa), need=function(f){ return (a.length+b.length)/2*f*0.62+10; };
 var f=10.5;
 while(f>8 && gap<need(f)) f-=0.5;
 return {size:f, drop:(gap<need(f))?13:0};
}

function fld(lbl,path,kind,unit,type){

function bindAll(root){
 var n=root.querySelectorAll('[data-p]');
 for(var i=0;i<n.length;i++){(function(e){
  var p=e.getAttribute('data-p'), k=e.getAttribute('data-k'), v=gp(p);
  e.value = k==='txt'?(v==null?'':v) : k==='disp'?(v?mm2d(v).toFixed(dD()):(v===0?'0':'')) :
            k==='len'?(v?mm2l(v).toFixed(dL()):(v===0?'0':'')) : (v===''||v==null?'':v);
  e.oninput=function(){
   var x=this.value;
   if(k==='txt') sp(p,x);
   else if(k==='disp') sp(p,d2mm(parseFloat(x)||0));
   else if(k==='len') sp(p,l2mm(parseFloat(x)||0));
   else sp(p,parseFloat(x)||0);
   afterChange();
  };
 })(n[i]);}
}
/* FINAL is not a correction of its own — it is the confirmed state of
   whichever pass currently sits last: the newest correction (koreksi), or
   INITIAL itself if no correction was ever needed. Clicking "Jadikan FINAL"
   only sets a flag; it never copies or overwrites readings, so nothing in
   the pass list is ever destroyed. Adding or deleting a pass clears the
   flag, since the previously confirmed reading is no longer the current
   last one and must be reconfirmed. */
function setAsFinal(){ S.finalConfirmed=true; }
function passName(i){
 if(S.finalConfirmed && i===S.passes.length-1) return T('final');
 if(i===0) return T('desired');
 if(i===1) return T('initial');
 return T('pass')+' '+(i-1);
}

/* v1.5: flex plane wording is built in one place so the picker tile, the
   schematic strip and any future report line cannot drift apart. */
function flexWord(o){ return (o.flex===0?'0 flex plane':o.flex+' flex plane')+(o.elast?' \u00b7 elastomer':''); }
/* The schematic that used to be the picker tile now sits under the picker for
   the selected type only. The photograph identifies the coupling; the drawing
   carries the flex plane markers, and the flex plane count is what recBasis()
   uses to choose between the ANSI flex plane format, the ANSI offset and
   angularity format and Custom. Dropping the drawing entirely would have
   removed the only visual statement of that. */
function cplDetail(k){
 var o=CPLN[k]; if(!o) return '';
 var id=(LANG==='id'), b;
 if(o.flex===0) b=id?'Tidak ada flex plane. Di luar lingkup ANSI/ASA S2.75 dan API RP 686 yang keduanya mengatur kopling fleksibel, sehingga basis toleransi jatuh ke Custom dengan batas dari data mesin.'
                   :'No flex plane. Outside the flexible coupling scope of ANSI/ASA S2.75 and API RP 686, so the tolerance basis falls back to Custom with limits taken from the machine data.';
 else if(o.elast) b=id?'Elemen lentur tunggal tanpa flex plane yang tegas. ANSI mengarahkan tipe ini ke format offset & angularity, bukan sudut flex plane.'
                     :'A single flexing element with no discrete flex plane. ANSI directs this type to the offset & angularity format rather than a flex plane angle.';
 else b=id?'Dua flex plane tegas di kedua ujung elemen. Toleransi dinilai sebagai sudut di tiap flex plane selama span kopling di bawah 3 inch.'
          :'Two discrete flex planes, one at each end of the element. Tolerance is graded as an angle at each flex plane while the coupling span stays under 3 in.';
 return '<div class="cpldet"><div class="sch">'+cplIcon(k)+'</div><div class="txt">'+
   '<b>'+esc(o[LANG]||o.en)+' \u2014 <span class="fp">'+flexWord(o)+'</span></b>'+esc(b)+'</div></div>';
}

function critPill(c){
 var ok=critAccept(c);
 return ok===null?'<span class="pill n">\u2014</span>'
  :(ok?'<span class="pill g">ACCEPTED</span>':'<span class="pill r">REJECTED</span>');
}
/* The list is no longer fixed: rows can be appended for any extra parameter the
   job needs (thrust clearance, jacking gear backlash, seal float and so on) and
   any row can be removed. defaultCrit() is still the starting point and can be
   put back with the Standard list button. Report and Excel iterate S.crit, so
   added rows flow through to both without further change. */
function critAdd(){
 S.crit.push({d:'',dmin:'',dmax:'',act:'',rem:''});
 critRender(); autosaveMark();
 var n=$('critTable').querySelectorAll('input[data-f="d"]');
 if(n.length){ var e=n[n.length-1]; e.focus(); if(e.scrollIntoView) e.scrollIntoView({block:'center'}); }
}
function critDel(i){
 if(!S.crit[i]||S.crit.length<2) return;
 var nm=S.crit[i].d||('#'+(i+1));
 if(!confirm((LANG==='id'?'Hapus baris ':'Delete row ')+nm+' ?')) return;
 S.crit.splice(i,1); critRender(); autosaveMark();
}
function critReset(){
 if(!confirm(LANG==='id'
  ?'Kembalikan ke daftar standar? Baris tambahan dan seluruh isian critical dimension akan hilang.'
  :'Reset to the standard list? Added rows and every critical dimension entry will be lost.')) return;
 S.crit=defaultCrit(); critRender(); autosaveMark();
}
function critRender(){
 if(!S.crit||!S.crit.length) S.crit=defaultCrit();
 var idL=(LANG==='id');
 var h='<colgroup><col class="c-no"><col class="c-desc"><col class="c-num"><col class="c-num">'+
  '<col class="c-num"><col class="c-acc"><col class="c-rem"><col class="c-del"></colgroup>'+
  '<tr><th>No</th><th>'+(idL?'Deskripsi':'Description')+'</th><th>Design min</th><th>Design max</th>'+
  '<th>Actual</th><th>Acceptance</th><th>Remark</th><th></th></tr>';
 S.crit.forEach(function(c,i){
  h+='<tr><td>'+(i+1)+'</td>'+
   '<td class="l"><input data-c="'+i+'" data-f="d" autocomplete="off" spellcheck="false" placeholder="'+
     (idL?'nama parameter':'parameter name')+'"></td>'+
   '<td><input data-c="'+i+'" data-f="dmin" type="number" step="any" inputmode="decimal"></td>'+
   '<td><input data-c="'+i+'" data-f="dmax" type="number" step="any" inputmode="decimal"></td>'+
   '<td><input data-c="'+i+'" data-f="act" type="number" step="any" inputmode="decimal"></td>'+
   '<td id="critAcc'+i+'">'+critPill(c)+'</td>'+
   '<td><input data-c="'+i+'" data-f="rem" autocomplete="off"></td>'+
   '<td class="del"><button class="xbtn" data-del="'+i+'" title="'+(idL?'Hapus baris':'Delete row')+'"'+
     (S.crit.length<2?' disabled':'')+'>\u00d7</button></td></tr>';
 });
 $('critTable').innerHTML=h;
 var n=$('critTable').querySelectorAll('input');
 for(var i=0;i<n.length;i++){(function(e){
  var idx=+e.getAttribute('data-c'), f=e.getAttribute('data-f'), v=S.crit[idx][f];
  if(f==='dmin'||f==='dmax'||f==='act') e.value=(v===''||v==null)?'':mm2d(v).toFixed(dD());
  else e.value=v==null?'':v;
  if(f==='d'||f==='rem') e.title=e.value;
  e.oninput=function(){
   S.crit[idx][f]=(f==='d'||f==='rem')?this.value:(this.value===''?'':d2mm(parseFloat(this.value)||0));
   if(f==='d'||f==='rem') this.title=this.value;
   /* only the acceptance cell depends on the numbers, so patch that one cell
      instead of rebuilding the table: rebuilding destroyed the focused input
      and dropped the caret after every single keystroke. */
   if(f!=='d'&&f!=='rem'){ var cell=$('critAcc'+idx); if(cell) cell.innerHTML=critPill(S.crit[idx]); }
   autosaveMark();
  };
 })(n[i]);}
 var b=$('critTable').querySelectorAll('button[data-del]');
 for(var j=0;j<b.length;j++){(function(e){
  e.onclick=function(){ critDel(+e.getAttribute('data-del')); };
 })(b[j]);}
}

 if($('delPass')) $('delPass').onclick=function(){ S.passes.splice(ACTIVE,1); ACTIVE=Math.min(ACTIVE,S.passes.length-1); S.finalConfirmed=false; draw(); };
 if($('mkFinal')) $('mkFinal').onclick=function(){ var src=passName(ACTIVE); setAsFinal(); draw();
  toast(LANG==='id'?'FINAL diambil dari '+src:'FINAL taken from '+src); };
 if($('unmkFinal')) $('unmkFinal').onclick=function(){ S.finalConfirmed=false; draw(); };
 ['stat','mov'].forEach(function(w){ ['T','L','R','B'].forEach(function(pos){
  var e=$('i_'+w+'_'+pos), b=$('s_'+w+'_'+pos);
  /* keyed in mils, stored in mm, everything downstream unchanged */
  e.value=(mm2dial(S.passes[ACTIVE][w][pos])||0).toFixed(dDial());
  function sync(){ b.className=(parseFloat(e.value)||0)<0?'neg':''; }
  e.oninput=function(){ S.passes[ACTIVE][w][pos]=dial2mm(parseFloat(this.value)||0); sync(); dialRefresh(); sumRender(); corrRender(); };
  b.onclick=function(){ var v=-(parseFloat(e.value)||0); e.value=v.toFixed(dDial());
   S.passes[ACTIVE][w][pos]=dial2mm(v); sync(); dialRefresh(); sumRender(); corrRender(); };
  sync();
 });});
 var g=$('segSim6'); g.onclick=function(e){var b=e.target.closest('button');if(!b)return;
  S.sim=b.getAttribute('data-m'); var c=g.children; for(var i=0;i<c.length;i++)c[i].classList.toggle('on',c[i]===b); corrRender(); };
 var sg=$('sagIn'); sg.value=S.sag?mm2d(S.sag).toFixed(dD()):'';
 sg.oninput=function(){ S.sag=Math.abs(d2mm(parseFloat(this.value)||0)); dialRefresh(); sumRender(); corrRender(); };
 $('tolBasis').onchange=function(){S.tol.basis=this.value;
  if(this.value==='ansioa'&&S.tol.grade==='AL4.5') S.tol.grade='AL2.2'; draw();};
 $('tolRpm').oninput=function(){S.tol.rpm=parseFloat(this.value)||1500;corrRender();};
 $('tolGrade').onchange=function(){S.tol.grade=this.value;draw();};
 $('tolGradeOA').onchange=function(){S.tol.grade=this.value;draw();};
 $('tolOff').value=S.tol.offAcc?mm2d(S.tol.offAcc).toFixed(dD()):'';
 $('tolAng').value=S.tol.angAcc||'';
 $('tolOff').oninput=function(){S.tol.offAcc=d2mm(parseFloat(this.value)||0);corrRender();};
 $('tolAng').oninput=function(){S.tol.angAcc=parseFloat(this.value)||0;corrRender();};
 $('wG').style.display=S.tol.basis==='ansi'?'':'none';
 $('wOA').style.display=S.tol.basis==='ansioa'?'':'none';
 $('wCO').style.display=S.tol.basis==='cust'?'':'none';
 $('wCA').style.display=S.tol.basis==='cust'?'':'none';

function dialRefresh(){
 var eff=effPass(ACTIVE), sagOn=(S.sag>0&&ACTIVE>0);
 ['stat','mov'].forEach(function(w){
  var c=$('cx_'+w);
  if(c) c.innerHTML=crossSVG(eff[w],crossCode(w),{light:LT(),big:1,
   title:(sagOn&&sagFor(w,ACTIVE)>0)?(LANG==='id'?'terkoreksi sag':'sag corrected'):''});
  ['T','R','B','L'].forEach(function(pos){
   var d=$('d_'+w+'_'+pos); if(d) d.innerHTML=dialSVG(S.passes[ACTIVE][w][pos],{light:LT()}); });
 });

function sumRender(){
 var so=$('sagOut');
 if(so) so.textContent=(S.sag>0)?((ACTIVE===0?(LANG==='id'?'DESIRED tidak dikoreksi':'DESIRED not corrected')
   :(LANG==='id'?'offset vertikal bergeser ':'vertical offset shifted ')+'+'+fD(S.sag/2)+' '+uD())):'';
 var eff=effPass(ACTIVE);
 ['stat','mov'].forEach(function(w){
  var d=eff[w], v=SA.diamondValid(d), o=SA.planeOffset(d);
  var tb=$('sum_'+w+'_tb'), of=$('sum_'+w+'_off'), wn=$('warn_'+w); if(!tb) return;
  tb.textContent=fD(v.sumTB)+' / '+fD(v.sumLR);
  of.textContent=fDs(o.v)+' / '+fDs(o.h);
  var bad=Math.abs(v.diff)>Math.max(0.0127,0.02*Math.max(Math.abs(v.sumTB),Math.abs(v.sumLR)));
  tb.className=bad?'vbad':'';
  wn.innerHTML=bad?'<div class="box w" style="margin-top:9px;font-size:11px">'+T('valid')+fD(v.diff)+' '+uD()+'</div>':'';
 });
}
/* correction table first, then the per-parameter offset table */
function corrTable(r){

  (LANG==='id'?'Jarak':'Distance')+'</th><th>'+(LANG==='id'?'Nilai':'Value')+'</th><th>'+(LANG==='id'?'Tindakan':'Action')+'</th></tr>'+
  '<tr class="vrow"><td class="axv" rowspan="2">'+T('vert')+'</td><td class="l">'+T('nf')+'</td><td>D2 '+fL(S.dim.D2)+'</td><td>'+fDs(r.move.ibV)+'</td><td>'+cell(r.move.ibV,'v')+'</td></tr>'+
  '<tr class="vrow"><td class="l">'+T('ff')+'</td><td>D3 '+fL(S.dim.D3)+'</td><td>'+fDs(r.move.obV)+'</td><td>'+cell(r.move.obV,'v')+'</td></tr>'+
  '<tr class="hrow"><td class="axh" rowspan="2">'+T('horz')+'</td><td class="l">'+T('nf')+'</td><td>D2 '+fL(S.dim.D2)+'</td><td>'+fDs(r.move.ibH)+'</td><td>'+cell(r.move.ibH,'h')+'</td></tr>'+
  '<tr class="hrow"><td class="l">'+T('ff')+'</td><td>D3 '+fL(S.dim.D3)+'</td><td>'+fDs(r.move.obH)+'</td><td>'+cell(r.move.obH,'h')+'</td></tr></table>'+
  '<p class="hint">'+(LANG==='id'
   ?'Nilai positif vertikal berarti tambah shim, negatif berarti kurangi shim. Nilai positif horizontal berarti dorong ke kiri, negatif dorong ke kanan. '+viewNote()
   :'A positive vertical value means add shim, negative means remove shim. A positive horizontal value means push left, negative push right. '+viewNote())+'</p>';

function offTable(r){
 var h='<table class="t"><tr><th>'+(LANG==='id'?'Arah':'Axis')+'</th><th>'+(LANG==='id'?'Parameter':'Parameter')+'</th><th>'+
  (LANG==='id'?'Nilai':'Value')+'</th><th>'+(LANG==='id'?'Batas':'Limit')+'</th><th>Status</th></tr>';
 ['v','h'].forEach(function(ax){
  var rows=r.params.filter(function(p){return p.ax===ax;});
  rows.forEach(function(p,i){
   h+='<tr class="'+(ax==='v'?'vrow':'hrow')+'">'+
    (i===0?'<td class="'+(ax==='v'?'axv':'axh')+'" rowspan="'+rows.length+'">'+(ax==='v'?T('vert'):T('horz'))+'</td>':'')+
    '<td class="l">'+esc(p.lbl)+'</td>'+
    '<td>'+(p.kind==='ang'?fA(p.value)+' in/in':fDs(p.value)+' '+uD())+'</td>'+
    '<td>'+(p.kind==='ang'?fA(p.acc)+' in/in':fD(p.acc)+' '+uD())+'</td>'+
    '<td><span class="pill '+p.grade.cls+'">'+p.grade.txt+(p.grade.cls==='n'?'':' '+Math.round(p.grade.ratio*100)+'%')+'</span></td></tr>';
  });
 });
 return h+'</table>';

function addPhoto(file){
 return new Promise(function(res,rej){
  var r=new FileReader();
  r.onload=function(){
   var img=new Image();
   img.onload=function(){
    var mx=1280, w=img.width, h=img.height, sc=Math.min(1,mx/Math.max(w,h));
    var c=document.createElement('canvas'); c.width=Math.round(w*sc); c.height=Math.round(h*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    S.photos.push({d:c.toDataURL('image/jpeg',0.72),cap:'',t:new Date().toISOString()}); res();
   };
   img.onerror=rej; img.src=r.result;
  };
  r.onerror=rej; r.readAsDataURL(file);
 });
}

var DB=null;

  if(!db.objectStoreNames.contains('jobs')) db.createObjectStore('jobs',{keyPath:'id'});
  if(!db.objectStoreNames.contains('auto')) db.createObjectStore('auto',{keyPath:'id'}); };
 rq.onsuccess=function(e){ DB=e.target.result; res(DB); };
 rq.onerror=function(){ rej(rq.error); }; }); }
function dbPut(rec){ return dbOpen().then(function(db){ return new Promise(function(res,rej){

/* ===== v1.4 CRASH / REFRESH RECOVERY ====================================
   On a tablet a downward swipe on the touch screen can trigger the browser
   pull-to-refresh, which used to throw away everything keyed in so far. Two
   independent guards now cover that:
     1. overscroll-behavior:contain on html/body/main disables pull-to-refresh
        inside the app, so the accidental gesture no longer reloads at all;
     2. every edit is mirrored into a separate IndexedDB store and read back on
        the next load, so a refresh, a tab close or a flat battery costs at most
        the last keystroke. The mirror is NOT the archive: doSave / Riwayat are
        unchanged and still hold the deliberately saved jobs.                  */
var AUTO_KEY='current', AUTO_MAX_AGE=45*864e5;
var autoTimer=null, autoOn=false;
function dbAutoPut(rec){ return dbOpen().then(function(db){ return new Promise(function(res,rej){
 var t=db.transaction('auto','readwrite'); t.objectStore('auto').put(rec);
 t.oncomplete=function(){res(rec);}; t.onerror=function(){rej(t.error);}; });}); }
function dbAutoGet(){ return dbOpen().then(function(db){ return new Promise(function(res,rej){
 var t=db.transaction('auto','readonly'), rq=t.objectStore('auto').get(AUTO_KEY);
 rq.onsuccess=function(){res(rq.result||null);}; rq.onerror=function(){rej(rq.error);}; });}); }
function dbAutoClear(){ return dbOpen().then(function(db){ return new Promise(function(res){
 var t=db.transaction('auto','readwrite'); t.objectStore('auto').delete(AUTO_KEY);
 t.oncomplete=function(){res(1);}; t.onerror=function(){res(0);}; });}).catch(function(){return 0;}); }
/* a blank sheet is not worth restoring; only offer the session back if the
   user actually keyed something in */
function stateHasContent(d){
 if(!d) return false;
 var j=d.job||{};
 if(j.tag||j.mwo||j.performer||j.desc) return true;
 var std={}; try{ defaultCrit().forEach(function(c){ std[c.d]=1; }); }catch(e){}
 if(d.crit&&d.crit.some(function(c){
  return (c.act!==''&&c.act!=null)||c.rem||(c.d&&!std[c.d]); })) return true;
 if(d.sf&&d.sf.r&&d.sf.r.some(function(v){ return +v!==0; })) return true;
 if(d.passes&&d.passes.some(function(p){
  return ['T','L','R','B'].some(function(k){
   return +((p.stat||{})[k]||0)!==0||+((p.mov||{})[k]||0)!==0; }); })) return true;
 if(d.photos&&d.photos.length) return true;
 if(d.ev&&(d.ev.analysis||d.ev.recommendation)) return true;
 if(d.sf&&d.sf.note) return true;
 return false;
}

function autosaveRestore(){
 return dbAutoGet().then(function(rec){
  if(!rec||!rec.S) return false;
  if(rec.saved&&(Date.now()-new Date(rec.saved).getTime())>AUTO_MAX_AGE) return dbAutoClear().then(function(){return false;});
  if(!stateHasContent(rec.S)) return false;
  if(!applyJob(rec)) return false;
  S.jobId=rec.jobId||null;
  if(rec.lang) LANG=rec.lang;
  if(typeof rec.step==='number') STEP=Math.max(0,Math.min(7,rec.step));
  if(typeof rec.active==='number') ACTIVE=Math.max(0,Math.min(rec.active,S.passes.length-1));
  var u=$('segUnit').children; for(var i=0;i<u.length;i++) u[i].classList.toggle('on',u[i].getAttribute('data-u')===UNIT);
  var l=$('segLang').children; for(var k=0;k<l.length;k++) l[k].classList.toggle('on',l[k].getAttribute('data-l')===LANG);
  renderSteps(); draw(); rbarShow(rec);
  return true;
 }).catch(function(){ return false; });
}

   chkName:d.job.checked||'',chkTitle:d.job.checkedTitle||'',

 if(!d.method) d.method=rec.method||'rev';

 if(d.mach.driverCustom===undefined) d.mach.driverCustom='';
 if(d.mach.drivenCustom===undefined) d.mach.drivenCustom='';
 if(!d.cpl) d.cpl={type:'disc'};
 if(!d.dim) d.dim=JSON.parse(JSON.stringify(S.dim));
 if(!d.dim.H) d.dim.H=6*IN;
 if(!d.dim.gap) d.dim.gap=d.dim.D1||5*IN;
 if(!d.sf) d.sf={r:[0,0,0,0],limit:2*MM,note:'',checked:false};
 if(!d.sf.r) d.sf.r=[0,0,0,0];
 if(!d.crit||!d.crit.length) d.crit=defaultCrit();
 if(!d.tol) d.tol={basis:'api',rpm:1500,grade:'AL2.2',offAcc:0,angAcc:0};
 if(['ansi','ansioa','api','cust'].indexOf(d.tol.basis)<0) d.tol.basis='api';   /* retired bases map to API */
 if(!d.ev) d.ev={analysis:'',recommendation:''};
 if(!d.photos) d.photos=[];
 if(!d.graph) d.graph={cell:16,xper:1,yper:1,nx:36,ny:16,auto:true};
 if(d.graph.nx===undefined) d.graph.nx=36;
 if(d.graph.ny===undefined) d.graph.ny=16;
 if(!d.sim) d.sim='eq';
 if(!d.passes||!d.passes.length) d.passes=[newPass('desired'),newPass('initial')];
 d.passes=d.passes.map(function(p){
  var z=function(o){o=o||{};return {T:+o.T||0,L:+o.L||0,R:+o.R||0,B:+o.B||0};};
  return {name:p.name||'pass',time:p.time||'',stat:z(p.stat),mov:z(p.mov)}; });
 /* jobs saved by the old build marked FINAL by writing name:'final' into the
    last pass; carry that over as the new confirmed flag so old files still
    show FINAL instead of silently reverting to a numbered pass. */

function applyJob(rec){
 rec=migrate(rec);
 if(!rec||!rec.S) return false;
 var d=rec.S;
 ['method','view','job','sign','mach','cpl','dim','sf','crit','passes','tol','ev','photos','graph','sim','finalConfirmed'].forEach(function(k){
  if(d[k]!==undefined) S[k]=d[k]; });
 if(!S.photos) S.photos=[];
 if(!S.sign) S.sign={prepName:'',prepTitle:'',chkName:'',chkTitle:'',appName:'',appTitle:''};
 if(!S.graph) S.graph={cell:16,xper:1,yper:1,auto:true};
 if(!S.dim.H) S.dim.H=6*IN; if(!S.dim.gap) S.dim.gap=S.dim.D1||5*IN;
 if(!S.job.desc) S.job.desc='';
 S.jobId=rec.id||null;
 if(typeof rbarHide==='function') rbarHide();
 if(rec.unit) UNIT=rec.unit;
 ensurePasses(); ACTIVE=Math.max(0,Math.min(ACTIVE,S.passes.length-1));

/* ===== ORIENTATION OF THE TOP VIEW ======================================
   Left and right are always taken from an observer standing behind the
   DRIVER, facing the coupling. The frames draw the stationary machine on
   the left and the movable machine on the right, so which edge of the page
   is the observer's right depends on which of the two is the driver:

     movable = driver   ->  the driver sits at the right of the frame, the
                            observer faces left, and the observer's right is
                            the TOP of the page
     movable = driven   ->  the driver sits at the left of the frame, the
                            observer faces right, and the observer's right is
                            the BOTTOM of the page

   Getting this wrong does not change a single number, but it makes the top
   view disagree with the correction words, which is exactly what happened.  */
function hSign(){ return S.mach.movable==='driver' ? -1 : 1; }
function edgeTop(){ return hSign()<0 ? (LANG==='id'?'KANAN':'RIGHT') : (LANG==='id'?'KIRI':'LEFT'); }
function edgeBot(){ return hSign()<0 ? (LANG==='id'?'KIRI':'LEFT') : (LANG==='id'?'KANAN':'RIGHT'); }

/* ===== MACHINE ELEVATIONS ==============================================
   Side elevations drawn to the proportions of the real machines: a TEFC
   motor with fan cowl, terminal box and foot rails; an overhung process
   pump with bearing housing, seal chamber, volute and nozzle flanges; a
   split casing turbine with steam chest and exhaust; a barrel compressor
   with heads and nozzles.                                                 */
/* ===== v1.5 SIMULATION MACHINE BODIES ===================================
   The elevations and plans used to be drawn per machine type: TEFC cowls,
   volutes, cylinder heads, gear wheels. At the scale these figures are
   actually read they added visual noise without adding information, and
   the outlines varied enough between types that a driver and a driven of
   different heights made the shaft centreline harder to follow, which is
   the one thing these figures exist to show.
   Both are now a plain box, identical for every machine type. The type is
   still stated in the caption the callers draw. What the figure carries is
   the geometry: the shaft stub, the centreline, the coupling gap, the feet
   and the exaggerated offsets.
   Vertical: bottom edge sits exactly at +H, which is where simEq() starts
   the foot columns, so the feet emerge from the body instead of floating.
   The k argument is kept so the signature and every call site are
   unchanged, and so a type specific body can come back without touching
   the callers.                                                            */
function eqBody(k,F,L,H,col,plain){
 var G=P.mt2, G2=P.mt, sh=Math.max(3,H*0.20), u0=0.11*L, u1=0.95*L;
 function q(u,v){var p=F(u,v);return p[0]+','+p[1];}
 function pg(pts,fill,w,extra){ return '<polygon points="'+pts.map(function(a){return q(a[0],a[1]);}).join(' ')+
  '" fill="'+(fill||'none')+'" stroke="'+col+'" stroke-width="'+(w||1.5)+'"'+(extra?' '+extra:'')+'/>'; }
 function li(a1,b1,a2,b2,w,extra){ var a=F(a1,b1),b=F(a2,b2);
  return '<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="'+col+'" stroke-width="'+(w||1)+'"'+(extra?' '+extra:'')+'/>'; }

 /* v1.6: plain draws the box only, filling u = 0 to L. dimFig() needs this
    because it draws the shaft itself, sized to bridge the real distance
    between the machine face and the coupling hub. The stub built in here is
    a fixed fraction of L, which is fine for the simulation views where
    nothing has to meet a hub, but in the dimension figure it left the hub
    floating clear of the shaft. */
 if(plain){ s+=pg([[0,H],[L,H],[L,-H],[0,-H]],G,1.9); }
 else {
  s+=pg([[0,sh],[u0,sh],[u0,-sh],[0,-sh]],G2,1.3);                /* shaft stub */
  s+=pg([[u0,H],[u1,H],[u1,-H],[u0,-H]],G,1.9);                   /* the machine */

function eqPlan(k,F,L,H,col){

 function li(a1,b1,a2,b2,w,extra){ var a=F(a1,b1),b=F(a2,b2);
  return '<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="'+col+'" stroke-width="'+(w||1)+'"'+(extra?' '+extra:'')+'/>'; }

function svgToPng(svg,px){

  try{
   var probe=document.createElement('canvas');
   if(typeof Image!=='function' || !probe || typeof probe.getContext!=='function'){ return res(null); }
   var m=/viewBox="([\d.\-]+) ([\d.\-]+) ([\d.\-]+) ([\d.\-]+)"/.exec(svg);
   var vw=m?parseFloat(m[3]):800, vh=m?parseFloat(m[4]):400;
   var tagged=svg.replace(/<svg /,'<svg xmlns="http://www.w3.org/2000/svg" width="'+vw+'" height="'+vh+'" ');
   if(tagged.indexOf('xmlns=')<0) tagged=tagged.replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" ');
   var img=new Image();
   img.onload=function(){
    try{
     var c=document.createElement('canvas'); c.width=px; c.height=Math.round(px*vh/vw);
     var g=c.getContext('2d'); g.fillStyle='#ffffff'; g.fillRect(0,0,c.width,c.height);

     res({u8:b64bytes(c.toDataURL('image/png')),w:c.width,h:c.height});
    }catch(e){ res(null); }
   };
   img.onerror=function(){ res(null); };
   img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(tagged);
  }catch(e){ res(null); }
 });
}

/* ===== VERIFICATION SUITE ==============================================
   Every geometric claim in the app is re-derived here from a synthetic
   machine whose centreline is known in advance. The readings are generated
   from the geometry, fed back through the solver, and the recovered foot
   moves are compared with the moves that must, by construction, bring the
   movable centreline onto the desired one.                                */
function mkDia(ov,oh){ return {T:0,B:2*ov,R:ov+oh,L:ov-oh}; }
/* build a reading pass that reproduces a given movable centreline */
function synthRev(vA,vB,hA,hB,D1){
 return {name:'x',stat:mkDia(vA,-hA), mov:mkDia(-(vA+vB*D1), hA+hB*D1)};
}
function synthFR(vA,vB,hA,hB,H){
 return {name:'x',stat:mkDia(vA,-hA), mov:mkDia(-vB*H/2, hB*H/2)};
}
function withState(f){
 var keep=JSON.stringify(S), ku=UNIT, r;
 try{ r=f(); } finally { S=JSON.parse(keep); UNIT=ku; }
 return r;
}

  LANG='en'; var lfEn=T('lf'), rtEn=T('rt'); LANG=keep;
  return ckS([['left word defined',lf,'DORONG KE KIRI'],
   ['right word defined',rt,'DORONG KE KANAN'],
   ['left and right differ',lf!==rt,true],
   ['positive move draws the table left word',drawnPos,tblPos],
   ['negative move draws the table right word',drawnNeg,tblNeg],
   ['on target is not a direction',tblZero,'SUDAH PAS'],
   ['English left unchanged',lfEn,'PUSH LEFT'],
   ['English right unchanged',rtEn,'PUSH RIGHT']]);
 });}},
{n:'SIM-3  Foot correction labels never overlap each other',
 d:'DORONG KE KIRI is longer than the GESER KIRI it replaced, which exposed an overlap that was\n'+
  'already latent: with D2 and D3 close together the I/B and O/B labels ran into one another.\n'+
  'footFit() shrinks to an 8px floor first and only then splits the pair onto two rows. A drop of\n'+
  '13 moves BOTH rows, so the O/B text lands one full row clear of the I/B tag underneath it.',
 f:function(){ return withState(function(){
  var wide=footFit('DORONG KE KIRI 0.0180','DORONG KE KIRI 0.0210',300,760);
  var mid =footFit('DORONG KE KIRI 0.0180','DORONG KE KIRI 0.0210',630,760);
  var tight=footFit('DORONG KE KIRI 0.0180','DORONG KE KIRI 0.0210',720,760);
  var shrt=footFit('SUDAH PAS','SUDAH PAS',680,760);
  return ckS([['wide spacing keeps full size',wide.size,10.5],
   ['wide spacing stays on one row',wide.drop,0],
   ['medium spacing shrinks instead of splitting',mid.size<10.5&&mid.drop===0,true],
   ['shrink never goes below the floor',tight.size>=8,true],
   ['tight spacing splits the rows',tight.drop,13],
   ['short labels still fit when close',shrt.drop,0]]);
 });}},
{n:'UNIT-2  Dial boxes are keyed in mils, everything else stays in inch',
 d:'Only the twelve cross boxes changed unit. One mil is 0.001 inch, one decimal of a mil is 0.0001\n'+
  'inch, which is the resolution the inch boxes had at dD() 4, so nothing is lost. uD() and the\n'+
  'inch converters used by the corrections, the summaries, the report and Excel are untouched, and\n'+
  'metric mode falls back to plain mm on both paths.',
 f:function(){ return withState(function(){
  var u=UNIT; UNIT='imp';
  var impU=dialU(), impD=dDial(), other=uD();
  var stored=dial2mm(4.5), back=mm2dial(stored), inches=mm2d(stored), res=dial2mm(0.1);
  UNIT='met'; var metU=dialU(), metRound=mm2dial(dial2mm(0.037)); UNIT=u;
  var n=ck([['4.5 mils stored as mm',stored,0.1143],
   ['round trips back to 4.5 mils',back,4.5],
   ['same value shown as inch elsewhere',inches,0.0045],
   ['0.1 mil resolution in mm',res,0.00254],
   ['metric round trip untouched',metRound,0.037]]);
  var t=ckS([['imperial dial unit',impU,'mils'],['one decimal of a mil',impD,1],
   ['other fields still inch',other,'inch'],['metric dial unit',metU,'mm']]);
  return {pass:n.pass&&t.pass, detail:n.detail+'\n'+t.detail};
 });}},
{n:'DIR-1  Horizontal correction is right with either machine movable',
 d:'The engine takes the STATIONARY shaft as datum and x runs from the stationary indicator plane\n'+
  'toward the movable feet, so the axial axis reverses when the movable machine changes. The sign\n'+
  'of the horizontal answer does NOT, because it is anchored to the dial clock positions, which\n'+
  'ROTA fixes from behind the driver for both sets. A pure parallel offset of 10 mils to the\n'+
  'observer right must therefore read PUSH LEFT 10 mils at both feet whichever machine is moved.\n'+
  'What does depend on the choice is only hSign(), the drawing orientation, covered by VIEW-1.',
 f:function(){ return withState(function(){
  var d=10*SA.MIL_MM;                     /* movable shaft sits 10 mils to the observer right */
  S.method='rev'; S.dim.D1=6*IN; S.dim.D2=12*IN; S.dim.D3=24*IN; S.sag=0;
  S.passes=[newPass('des'),newPass('as')];
  /* readings ON the stationary hub see the stationary hub displaced -d, and
     readings ON the movable hub see it displaced +d: a pure parallel offset */
  S.passes[1].stat={T:0,B:0,R:-d,L:d};
  S.passes[1].mov ={T:0,B:0,R: d,L:-d};
  S.mach.movable='driven'; var a=solveIdx(1), wa=mvWordH(a.move.ibH);
  S.mach.movable='driver';  var b=solveIdx(1), wb=mvWordH(b.move.ibH);
  var mils=function(v){return v/SA.MIL_MM;};
  var num=ck([['I/B move, movable = driven',mils(a.move.ibH),10],
   ['O/B move, movable = driven',mils(a.move.obH),10],
   ['I/B move, movable = driver',mils(b.move.ibH),10],
   ['O/B move, movable = driver',mils(b.move.obH),10],
   ['no angularity introduced',mils(a.angH)*1000,0]]);
  if(!num.pass) return num;
  LANG='id';
  var w2=ckS([['both feet say push left',wa,'DORONG KE KIRI'],
   ['and the answer does not change with the movable machine',wa,wb],
   ['drawing flips instead',(function(){S.mach.movable='driven';var p=hSign();
     S.mach.movable='driver';return p!==hSign();})(),true]]);
  return {pass:num.pass&&w2.pass, detail:num.detail+'\n'+w2.detail};
 });}},
{n:'DIA-1  Plane offset and the validity rule',
 d:'Offset at a plane is (180 - 0)/2 vertical and (90 - 270)/2 horizontal. For any true four point set\n'+
   '0 + 180 must equal 90 + 270, so a mis-keyed reading is caught before it is used.',
 f:function(){ var I=function(v){return v*IN;};
  var o=SA.planeOffset({T:0,L:I(0.002),R:I(0.003),B:I(0.005)});
  var ok=SA.diamondValid({T:0,L:I(0.002),R:I(0.003),B:I(0.005)});
  var bad=SA.diamondValid({T:0,L:I(0.002),R:I(0.003),B:I(0.006)});
  var syn=mkDia(0.004*IN,0.001*IN);
  return ck([['offset vertical',o.v/IN,0.0025],['offset horizontal',o.h/IN,0.0005],
   ['valid set difference',ok.diff/IN,0],['invalid set difference',bad.diff/IN,0.001],
   ['synthetic set is self consistent',SA.diamondValid(syn).diff,0]]); }},
{n:'SF-1  Soft foot limit and pattern recognition',
 d:'ANSI/ASA S2.75 and API RP 686 both put the limit at 0.05 mm (2 mils). A reading exactly at the limit\n'+
   'does not trip. Two diagonal feet within 10 percent of each other is even rocking and each gets half\n'+
   'the average, because shimming either one in full moves the rock to the other diagonal.',
 f:function(){
  var a=SA.softFoot([0.05,0,0,0],0.05), b=SA.softFoot([0.0501,0,0,0],0.05);
  var c=SA.softFoot([0.20,0.01,0.01,0.19],0.05), e=SA.softFoot([0.15,0.12,0.01,0.01],0.05);
  return ckS([['exactly at limit passes',a.pass,true],['just over fails',b.pass,false],
   ['diagonal pair is even rocking',c.typeId,'evenRock'],['half of average shim',+c.shim[0].toFixed(5),0.0975],
   ['same end is induced',e.typeId,'induced'],['2 mils in mm',+(2*SA.MIL_MM).toFixed(4),0.0508]]); }},
{n:'CRIT-2  Variable length critical dimension list',
 d:'The critical dimension list is no longer fixed. Rows can be appended for parameters a\n'+
  'particular job needs and rows can be removed, and both the report and the Excel export\n'+
  'walk S.crit, so an added row is carried through to the printed record. Standard list\n'+
  'restores defaultCrit() exactly.',
 f:function(){
  var keep=JSON.parse(JSON.stringify(S.crit));
  var base=defaultCrit().length;
  S.crit=defaultCrit();
  S.crit.push({d:'THRUST BEARING CLEARANCE',dmin:0.003*IN,dmax:0.008*IN,act:0.005*IN,rem:''});
  var added=S.crit.length, accAdded=critAccept(S.crit[S.crit.length-1]);
  S.crit.splice(2,1);
  var afterDel=S.crit.length;
  S.crit=defaultCrit();
  var reset=S.crit.length, names=S.crit[1].d.indexOf('COUPLING HUB RUN OUT')>0;
  S.crit=keep;
  return ckS([['standard list length',base,7],
   ['one row appended',added,base+1],
   ['appended row is evaluated',accAdded,true],
   ['one row removed',afterDel,base],
   ['standard list restored',reset,base],
   ['default names still built from machine names',names,true]]); }},
{n:'CRIT-3  Autosave snapshot survives a reload',
 d:'A pull-to-refresh on the tablet used to wipe the form. Every edit is mirrored into a\n'+
  'separate IndexedDB store; on the next load the mirror is read back through the same\n'+
  'migrate/applyJob path as an archived job. A blank sheet is never restored, so a fresh\n'+
  'open still starts clean.',
 f:function(){
  var blank={job:{tag:'',mwo:'',performer:'',desc:''},crit:defaultCrit(),
   sf:{r:[0,0,0,0],note:''},passes:[{stat:{T:0,L:0,R:0,B:0},mov:{T:0,L:0,R:0,B:0}}],photos:[],ev:{}};
  var typed=JSON.parse(JSON.stringify(blank)); typed.job.tag='K-1101';
  var reading=JSON.parse(JSON.stringify(blank)); reading.passes[0].mov.T=0.004*IN;
  var critEdit=JSON.parse(JSON.stringify(blank)); critEdit.crit[3].act=0.0015*IN;
  var extraRow=JSON.parse(JSON.stringify(blank));
  extraRow.crit.push({d:'JACKING GEAR BACKLASH',dmin:'',dmax:'',act:'',rem:''});
  var rec=packJob(); rec.id=AUTO_KEY; rec.auto=1;
  var round=migrate(JSON.parse(JSON.stringify(rec)));
  return ckS([['blank sheet is not restored',stateHasContent(blank),false],
   ['equipment tag counts as content',stateHasContent(typed),true],
   ['a dial reading counts as content',stateHasContent(reading),true],
   ['a critical dimension actual counts as content',stateHasContent(critEdit),true],
   ['an added critical dimension row counts as content',stateHasContent(extraRow),true],
   ['snapshot keyed for the auto store',rec.id,AUTO_KEY],
   ['snapshot reopens through migrate',!!(round&&round.S&&round.S.crit&&round.S.crit.length>0),true]]); }},
{n:'CRIT-1  Critical dimension acceptance',
 d:'Hub run out is judged against the API window 0 to 2 mils. A value inside the window is accepted, a\n'+
   'value outside is rejected, and a blank actual gives no verdict at all rather than a false pass.',
 f:function(){ var I=function(v){return v*IN;};
  return ckS([['0.0015 in a 0 to 2 mil window',critAccept({dmin:0,dmax:0.002*I(1),act:0.0015*I(1)}),true],
   ['0.0031 in the same window',critAccept({dmin:0,dmax:0.002*I(1),act:0.0031*I(1)}),false],
   ['exactly on the limit',critAccept({dmin:0,dmax:0.002*I(1),act:0.002*I(1)}),true],
   ['blank actual',critAccept({dmin:0,dmax:0.002*I(1),act:''}),null]]); }},
{n:'FILE-1  Automatic file name is YYMMDD_EQUIPMENT',
 d:'15 August 2026 on tag E3-G-11B must produce 260815_E3-G-11B, and the printed PDF carries the same\n'+
   'name. Unsafe characters are reduced so the name is valid on the Android file system.',
 f:function(){ return withState(function(){
  S.job.date='2026-08-15'; S.job.tag='E3-G-11B'; var a=jobFileName();
  S.job.date='2026-01-05'; S.job.tag='p 101 a/b'; var b=jobFileName();
  S.job.tag=''; var c=fileBase();
  return ckS([['15 Aug 2026, E3-G-11B',a,'260815_E3-G-11B.json'],
   ['5 Jan 2026, p 101 a/b',b,'260105_P-101-A-B.json'],['empty tag',c,'260105_NO-TAG']]);
 });}},
{n:'FINAL-1  Jadikan FINAL only flags the current last pass, nothing is copied',
 d:'FINAL is not a correction of its own. Clicking "Jadikan FINAL" must not create a new pass, must not\n'+
   'overwrite any other pass, and must not change a single reading — it only marks the pass that is\n'+
   'already last as confirmed, so the readings before and after are identical.',
 f:function(){ return withState(function(){
  var I=function(v){return v*IN;};
  S.method='rev'; S.dim={D1:I(11),D2:I(19),D3:I(28),H:I(6),gap:I(11)}; S.tol.basis='api';
  S.passes=[{name:'desired',stat:mkDia(0.0025*IN,0),mov:mkDia(-0.0035*IN,0)},
            {name:'initial',stat:mkDia(-0.0075*IN,0.0125*IN),mov:mkDia(0.010*IN,-0.003*IN)},
            {name:'pass',stat:mkDia(0.002*IN,0.001*IN),mov:mkDia(-0.003*IN,0)}];
  S.finalConfirmed=false;
  var n0=S.passes.length, before=solveIdx(S.passes.length-1);
  var lblBefore=passName(S.passes.length-1);
  setAsFinal();
  var after=solveIdx(S.passes.length-1);
  var c1=ck([['no extra pass is created',S.passes.length,n0],
             ['I/B vertical is unchanged by confirming',after.move.ibV,before.move.ibV],
             ['O/B vertical is unchanged by confirming',after.move.obV,before.move.obV],
             ['I/B horizontal is unchanged by confirming',after.move.ibH,before.move.ibH]]);
  var c2=ckS([['label before confirming was the numbered pass',lblBefore,T('pass')+' 1'],
              ['label after confirming reads FINAL',passName(S.passes.length-1),T('final')],
              ['finalConfirmed flag is set',S.finalConfirmed,true]]);
  return {pass:c1.pass&&c2.pass,detail:c1.detail+'\n'+c2.detail};
 });}},
{n:'FINAL-2  FINAL falls back to INITIAL when no correction pass exists',
 d:'If the reading is within tolerance with no shim correction needed, FINAL must still be reachable\n'+
   'directly from INITIAL, not only from a koreksi pass, and adding a later correction must clear the\n'+
   'flag again — the "addPass" action always resets it — so the new pass is never mislabeled FINAL.',
 f:function(){ return withState(function(){
  S.passes=[newPass('desired'),newPass('initial')];
  S.finalConfirmed=false;
  var lblBefore=passName(1);
  setAsFinal();
  var lblAfter=passName(1);
  /* mirrors what the "addPass" button handler does: push, then clear the flag */
  S.passes.push(newPass('pass')); S.finalConfirmed=false;
  var lblNew=passName(S.passes.length-1);
  return ckS([['before confirming, last slot reads INITIAL',lblBefore,T('initial')],
              ['after confirming with no pass, last slot reads FINAL',lblAfter,T('final')],
              ['after adding a pass the flag is cleared',S.finalConfirmed,false],
              ['the newly added pass is a plain koreksi, not FINAL',lblNew,T('pass')+' 1']]);
 });}},
{n:'VIEW-1  The top view is oriented from behind the driver',
 d:'Left and right are always taken from an observer behind the DRIVER. The frames put the stationary\n'+
   'machine on the left, so when the movable machine is the driver the observer faces leftwards across\n'+
   'the page and the observer right hand side is the TOP edge. Drawing it the other way makes the picture\n'+
   'contradict the correction words without changing any number.',
 f:function(){ return withState(function(){
  S.mach.movable='driver'; var a=hSign(), at=edgeTop();
  S.mach.movable='driven'; var b=hSign(), bt=edgeTop();
  LANG='en'; S.mach.movable='driver'; var ce=edgeTop(); LANG='id';
  return ckS([['movable is the driver, plus plots upward',a,-1],['and the top edge is the right hand side',at,'KANAN'],
   ['movable is the driven, plus plots downward',b,1],['and the top edge is the left hand side',bt,'KIRI'],
   ['label follows the language',ce,'RIGHT']]);
 });}},
{n:'LOAD-1  Old job files still open',
 d:'A file written by any earlier build must load. Fields that did not exist then are filled from the\n'+
   'current defaults and a tolerance basis that has since been retired falls back to API RP 686 rather\n'+
   'than leaving the job ungraded.',
 f:function(){ return withState(function(){
  var old={v:5,S:{method:'rev',job:{tag:'E3-G-11B',mwo:'123',date:'2026-08-15'},
   mach:{driver:'motor',driven:'pump',movable:'driver'},cpl:{type:'disc'},
   dim:{D1:11*IN,D2:19*IN,D3:28*IN},
   sf:{r:[0,0,0,0],limit:2*MM},
   tol:{basis:'half',rpm:2940,grade:'AL2.2'},
   passes:[{stat:{T:0,L:0.0025*IN,R:0.0025*IN,B:0.005*IN},mov:{T:0,L:-0.0035*IN,R:-0.0035*IN,B:-0.007*IN}},
           {stat:{T:0,L:0.002*IN,R:0.003*IN,B:0.005*IN},mov:{T:0,L:-0.003*IN,R:-0.003*IN,B:-0.006*IN}}]}};
  var m=migrate(JSON.parse(JSON.stringify(old)));
  var d=m.S; S.method=d.method; S.dim=d.dim; S.cpl=d.cpl; S.tol=d.tol; S.passes=d.passes; S.view=d.view;
  var r=solveIdx(1);
  return ckS([['job description filled',d.job.desc,''],['viewpoint defaults to driver',d.view,'driver'],
   ['face diameter filled',+(d.dim.H/IN).toFixed(2),6],['coupling gap filled',+(d.dim.gap/IN).toFixed(2),11],
   ['signature block created',typeof d.sign.prepName,'string'],
   ['retired basis mapped to API',d.tol.basis,'api'],
   ['I/B vertical still 0.00086',+(r.move.ibV/IN).toFixed(5),0.00086]]);
 });}},
{n:'XLS-1  Excel export builds a readable workbook',
 d:'The workbook is written as a store-only ZIP with no external library so the app stays one offline\n'+
   'file. Cells hold formulas, not frozen numbers, and the workbook is flagged for full recalculation so\n'+
   'Excel evaluates them on open.',
 f:function(){ return withState(function(){
  var b=null, err='';
  try{ b=buildXlsx(); }catch(e){ err=e.message; }
  var sx=sheetXml([[XT('a',1),XF('B1+1',5)]],[10,10]);
  return ckS([['workbook built',err===''?true:err,true],
   ['blob produced',!!b,true],
   ['formula written without a cached value',sx.indexOf('<f>B1+1</f>')>0,true],
   ['inline string written',sx.indexOf('t="inlineStr"')>0,true]]);
 });}},
{n:'UNIT-1  Unit conversion closes',
 d:'Readings are keyed in inch, dimensions in inch, everything held internally in millimetres. A unit\n'+
   'switch cannot change a graded result.',
 f:function(){ return ck([['0.001 inch reading in mm',d2mm(0.001),0.0254],
  ['1 inch dimension in mm',SA.l2mm(1,'imp'),25.4],['round trip dimension',SA.mm2l(SA.l2mm(3.5,'imp'),'imp'),3.5],
  ['round trip reading',mm2d(d2mm(0.0075)),0.0075],
  ['2 mils soft foot limit in mm',2*SA.MIL_MM,0.0508],
  ['same limit shown in inch',mm2d(2*SA.MIL_MM),0.002]]); }}
];
function ck(rows){var ok=true,o=[];rows.forEach(function(r){var t=Math.max(1e-9,Math.abs(r[2])*1e-6);
 var p=Math.abs(r[1]-r[2])<=t;if(!p)ok=false;o.push((p?'  OK  ':'  XX  ')+pd(r[0],40)+' got '+pd(fx(r[1]),16)+' expected '+fx(r[2]));});
 return {pass:ok,detail:o.join('\n')};}
function ckS(rows){var ok=true,o=[];rows.forEach(function(r){var p=r[1]===r[2];if(!p)ok=false;
 o.push((p?'  OK  ':'  XX  ')+pd(r[0],40)+' got '+pd(String(r[1]),16)+' expected '+r[2]);});return {pass:ok,detail:o.join('\n')};}
function pd(s,n){s=String(s);while(s.length<n)s+=' ';return s;}
function fx(v){return (Math.abs(v)<1e-12?0:v).toFixed(8).replace(/0+$/,'').replace(/\.$/,'.0');}
function runTests(){
 var p=0,h='';
 TESTS.forEach(function(t){var r;try{r=t.f();}catch(e){r={pass:false,detail:'EXCEPTION: '+e.message};}
  if(r.pass)p++;
  h+='<div style="border-bottom:1px solid var(--ln);padding:11px 16px"><div style="display:flex;gap:9px;align-items:center;font-size:12.5px;font-weight:600">'+
   '<span class="pill '+(r.pass?'g':'r')+'">'+(r.pass?'PASS':'FAIL')+'</span>'+esc(t.n)+'</div>'+
   '<p style="margin:5px 0 0;font-size:11.5px;color:var(--mu);line-height:1.55">'+esc(t.d).replace(/\n/g,'<br>')+'</p>'+
   '<pre style="margin:6px 0 0;font-family:var(--mono);font-size:11px;color:#a5b4c4;background:#0a0e13;border:1px solid var(--ln);border-radius:6px;padding:8px 10px;overflow:auto;white-space:pre-wrap">'+esc(r.detail)+'</pre></div>';});
 $('testSum').innerHTML='<b style="color:'+(p===TESTS.length?'#3fb950':'#f85149')+'">'+p+' / '+TESTS.length+' passed</b>';
 $('testBody').innerHTML=h; $('testModal').style.display='block';
 return p===TESTS.length;
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();
